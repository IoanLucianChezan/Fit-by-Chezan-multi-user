name: Ping app to keep Render awake

on:
  workflow_dispatch: {}
  schedule:
    - cron: '*/10 * * * *'

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the app
        run: curl -sS --max-time 20 https://fit-by-chezan-multi-user.onrender.com/ -o /dev/null -w "status: %{http_code}\n"
